apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yp-scraper
  namespace: yp-scraper
  annotations:
    # k3s uses Traefik by default
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  rules:
    - host: scraper.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 5001
